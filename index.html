<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>오일러 한붓그리기 마스터 100</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #090d16;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f1f5f9;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }
    header {
      text-align: center;
      margin-bottom: 6px;
    }
    h1 {
      margin: 0 0 2px 0;
      font-size: 22px;
      color: #38bdf8;
      letter-spacing: -0.5px;
    }
    .author-tag {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .top-panel {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #334155;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      flex-wrap: wrap;
      justify-content: center;
    }
    select {
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #475569;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }
    .badge {
      color: #facc15;
    }
    .student-badge {
      background: #334155;
      padding: 2px 8px;
      border-radius: 12px;
      color: #38bdf8;
    }
    .timer-badge {
      background: #0f172a;
      border: 1px solid #38bdf8;
      padding: 2px 8px;
      border-radius: 12px;
      color: #4ade80;
      font-family: monospace;
    }
    .game-board {
      position: relative;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      background: #111827;
      border: 2px solid #1f2937;
      overflow: hidden;
    }
    canvas {
      display: block;
      cursor: crosshair;
      touch-action: none;
    }
    .guide-text {
      margin-top: 8px;
      font-size: 13px;
      font-weight: bold;
      min-height: 20px;
      text-align: center;
      color: #94a3b8;
    }
    .controls {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #38bdf8;
      color: #0f172a;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    button:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }
    button.secondary {
      background: #334155;
      color: #f1f5f9;
    }
    button.secondary:hover {
      background: #475569;
    }
    button.submit-btn {
      background: #10b981;
      color: white;
      font-weight: bold;
    }
    button.submit-btn:hover {
      background: #059669;
    }
    button.toggle-active {
      background: #8b5cf6;
      color: white;
    }
    .difficulty-tag {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }
    .diff-1 { background: #15803d; color: #bbf7d0; }
    .diff-2 { background: #0369a1; color: #bae6fd; }
    .diff-3 { background: #b45309; color: #fef08a; }
    .diff-4 { background: #be123c; color: #fecdd3; }
    .diff-5 { background: #6b21a8; color: #f5d0fe; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-box {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 14px;
      max-width: 440px;
      width: 100%;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      user-select: text;
      -webkit-user-select: text;
    }
    .modal-box h3 {
      margin: 0 0 10px 0;
      color: #38bdf8;
      font-size: 18px;
      text-align: center;
    }
    .input-field {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
    }
    .input-field:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3);
    }
    .modal-btns {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 15px;
    }
    .table-container {
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid #334155;
      border-radius: 6px;
      margin-top: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: center;
    }
    th, td {
      padding: 8px 6px;
      border-bottom: 1px solid #334155;
    }
    th {
      background: #0f172a;
      color: #38bdf8;
      position: sticky;
      top: 0;
    }
  </style>
</head>
<body>

  <!-- 학번 4자리 로그인 모달 -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal-box">
      <h3>👋 수학 탐구 대원 등록</h3>
      <p style="font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 16px;">
        4자리 학번(예: 1105)과 이름을 입력하세요.
      </p>
      <input type="text" id="input-student-id" class="input-field" maxlength="4" placeholder="4자리 학번 (예: 1105)" autocomplete="off">
      <input type="text" id="input-student-name" class="input-field" placeholder="이름 입력 (예: 홍길동)" autocomplete="off">
      <div style="display: flex; justify-content: center; margin-top: 5px;">
        <button id="btn-start-game" type="button" style="width: 100%; padding: 12px; font-size: 15px; font-weight: bold;">탐구 시작하기 🚀</button>
      </div>
    </div>
  </div>

  <header>
    <h1>✏️ 오일러 한붓그리기 마스터 100</h1>
    <div class="author-tag">Designed & Developed by Seulgi Jeong</div>
  </header>

  <div class="top-panel">
    <span class="student-badge" id="display-student">대원: -</span>
    <div>
      <select id="stage-select"></select>
    </div>
    <span id="diff-badge" class="difficulty-tag diff-1">입문</span>
    <div>남은 선: <span id="ui-remaining" class="badge">0</span> / <span id="ui-total">0</span></div>
    <span class="timer-badge" id="ui-timer">⏱️ 00:00</span>
  </div>

  <div class="game-board">
    <canvas id="gameCanvas" width="540" height="380"></canvas>
  </div>

  <div class="guide-text" id="ui-msg">꼭짓점을 누르고 손을 떼지 않은 채 모든 선을 그리세요!</div>

  <div class="controls">
    <button id="btn-prev" class="secondary">◀ 이전</button>
    <button id="btn-reset" class="secondary">🔄 다시 하기</button>
    <button id="btn-degree" class="secondary">🔍 차수 보기</button>
    <button id="btn-quiz-hint">💡 퀴즈 힌트</button>
    <button id="btn-view-records" style="background: #eab308; color: #0f172a;">📊 학습 기록</button>
    <button id="btn-submit-sheet" class="submit-btn">🚀 선생님께 최종 제출</button>
    <button id="btn-next" style="display: none; background: #22c55e; color: white;">다음 스테이지 ▶</button>
  </div>

  <!-- 퀴즈 모달 -->
  <div class="modal-overlay" id="quiz-modal" style="display: none;">
    <div class="modal-box">
      <h3>📐 힌트 해금 수학 퀴즈</h3>
      <div class="quiz-q" id="quiz-question" style="font-size: 14px; margin-bottom: 12px; color: #e2e8f0; line-height: 1.4;">문제를 불러오는 중...</div>
      <input type="text" class="input-field" id="quiz-answer" placeholder="정답을 입력하세요">
      <div class="modal-btns">
        <button id="btn-quiz-cancel" class="secondary">닫기</button>
        <button id="btn-quiz-submit">정답 확인</button>
      </div>
    </div>
  </div>

  <!-- 학습 기록 모달 -->
  <div class="modal-overlay" id="records-modal" style="display: none;">
    <div class="modal-box" style="max-width: 520px;">
      <h3>📊 한붓그리기 학습 리포트</h3>
      <div style="font-size: 13px; color: #94a3b8; display: flex; justify-content: space-between; margin-bottom: 8px;">
        <span id="record-student-info">학번: - | 성명: -</span>
        <span id="record-clear-count">클리어: 0 / 100</span>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>스테이지</th>
              <th>난이도</th>
              <th>상태</th>
              <th>소요 시간</th>
            </tr>
          </thead>
          <tbody id="records-table-body"></tbody>
        </table>
      </div>
      <div class="modal-btns">
        <button id="btn-export-csv" style="background: #10b981; color: white;">📥 CSV 다운로드</button>
        <button id="btn-records-close" class="secondary">닫기</button>
      </div>
    </div>
  </div>

  <script>
    // 선생님 Apps Script Web App URL 연동
    const GOOGLE_SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyU4fpwiJTUsuYGXdFM6tXTstOqVHXyCbKMvZYSVB9gPOFUYvEj_ylu0jh9vHbswMhUIQ/exec";

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTone(freq, duration = 0.08, type = 'sine') {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function soundPass() { playTone(540, 0.06); }
    function soundWin() {
      playTone(523, 0.08);
      setTimeout(() => playTone(659, 0.08), 80);
      setTimeout(() => playTone(783, 0.08), 160);
      setTimeout(() => playTone(1046, 0.2), 240);
    }
    function soundFail() { playTone(160, 0.25, 'sawtooth'); }
    function soundKeyPassed() {
      playTone(880, 0.1, 'triangle');
      setTimeout(() => playTone(1174, 0.15, 'triangle'), 100);
    }

    let currentStudent = { id: "", name: "" };
    const stageRecords = {};
    let stageTimer = null;
    let stageElapsedSeconds = 0;

    function startTimer() {
      stopTimer();
      stageElapsedSeconds = 0;
      updateTimerDisplay();
      stageTimer = setInterval(() => {
        stageElapsedSeconds++;
        updateTimerDisplay();
      }, 1000);
    }

    function stopTimer() {
      if (stageTimer) {
        clearInterval(stageTimer);
        stageTimer = null;
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateTimerDisplay() {
      document.getElementById('ui-timer').innerText = `⏱️ ${formatTime(stageElapsedSeconds)}`;
    }

    const quizPool = [
      { q: "가장 작은 소수(Prime Number)는 무엇일까요?", a: "2" },
      { q: "12와 18의 최대공약수(GCD)는 얼마일까요?", a: "6" },
      { q: "일차방정식 2x + 5 = 13 에서 x의 값은?", a: "4" },
      { q: "(-3) × (-5) 의 계산 결과는 얼마일까요?", a: "15" },
      { q: "정삼각형의 한 내각의 크기는 몇 도(°)일까요? (숫자만 입력)", a: "60" },
      { q: "오일러 경로에서 출발점과 도착점이 달라야 하는 경우, 홀수점은 정확히 몇 개여야 할까요?", a: "2" },
      { q: "모든 꼭짓점의 차수가 짝수일 때 생기는 닫힌 한붓그리기 경로를 '오일러 (    )'라고 합니다. 괄호에 들어갈 단어는?", a: "회로" },
      { q: "절댓값이 7인 양수는 무엇일까요?", a: "7" }
    ];

    // =========================================================================
    // 🌟 100% 한붓그리기 가능 스테이지 생성기
    // =========================================================================
    const stages = [];

    function getDiffInfo(stNum) {
      if (stNum <= 20) return { name: "입문", cls: "diff-1" };
      if (stNum <= 40) return { name: "초급(곡선)", cls: "diff-2" };
      if (stNum <= 60) return { name: "중급(기하)", cls: "diff-3" };
      if (stNum <= 80) return { name: "고급(대칭망)", cls: "diff-4" };
      return { name: "마스터(복합망)", cls: "diff-5" };
    }

    function validateAndFixEulerian(nodes, edges) {
      const degrees = new Array(nodes.length).fill(0);
      edges.forEach(e => {
        degrees[e.u]++;
        degrees[e.v]++;
      });

      let oddNodes = [];
      degrees.forEach((d, idx) => {
        if (d % 2 !== 0) oddNodes.push(idx);
      });

      while (oddNodes.length > 2) {
        const u = oddNodes.pop();
        const v = oddNodes.pop();
        edges.push({ u, v, curvature: 0 });
      }

      return edges;
    }

    function buildUniqueStage(level) {
      const cx = 270, cy = 190;
      let title = `도형 Lv.${level}`;
      let nodes = [];
      let edges = [];

      if (level === 1) {
        title = "기본 삼각형";
        nodes = [{id:0, x:270, y:80}, {id:1, x:160, y:290}, {id:2, x:380, y:290}];
        edges = [{u:0, v:1}, {u:1, v:2}, {u:2, v:0}];
      } else if (level === 2) {
        title = "오일러의 집";
        nodes = [{id:0, x:180, y:290}, {id:1, x:360, y:290}, {id:2, x:360, y:170}, {id:3, x:180, y:170}, {id:4, x:270, y:80}];
        edges = [{u:0,v:1},{u:1,v:2},{u:2,v:3},{u:3,v:0},{u:0,v:2},{u:1,v:3},{u:3,v:4},{u:4,v:2}];
      } else if (level === 3) {
        title = "모래시계 (리본)";
        nodes = [{id:0, x:170, y:100}, {id:1, x:370, y:100}, {id:2, x:270, y:190}, {id:3, x:170, y:290}, {id:4, x:370, y:290}];
        edges = [{u:0,v:1},{u:1,v:2},{u:2,v:0},{u:2,v:3},{u:3,v:4},{u:4,v:2}];
      } else if (level === 4) {
        title = "열린 편지봉투";
        nodes = [{id:0, x:160, y:140}, {id:1, x:380, y:140}, {id:2, x:380, y:290}, {id:3, x:160, y:290}, {id:4, x:270, y:210}];
        edges = [{u:0,v:1},{u:1,v:2},{u:2,v:3},{u:3,v:0},{u:0,v:4},{u:1,v:4},{u:2,v:4},{u:3,v:4},{u:0,v:1, curvature:-30}];
      } else if (level === 5) {
        title = "쌍둥이 다이아몬드";
        nodes = [{id:0, x:270, y:60}, {id:1, x:170, y:150}, {id:2, x:370, y:150}, {id:3, x:270, y:240}, {id:4, x:170, y:330}, {id:5, x:370, y:330}];
        edges = [{u:0,v:1},{u:0,v:2},{u:1,v:3},{u:2,v:3},{u:1,v:2},{u:3,v:4},{u:3,v:5},{u:4,v:5},{u:1,v:4},{u:2,v:5}];
      } else if (level === 6) {
        title = "바람개비 사각연";
        nodes = [{id:0, x:270, y:70}, {id:1, x:400, y:190}, {id:2, x:270, y:310}, {id:3, x:140, y:190}, {id:4, x:270, y:190}];
        edges = [{u:0,v:1},{u:1,v:2},{u:2,v:3},{u:3,v:0},{u:0,v:4},{u:1,v:4},{u:2,v:4},{u:3,v:4},{u:0,v:2}];
      } else if (level === 7) {
        title = "삼각 피라미드 타워";
        nodes = [{id:0, x:270, y:70}, {id:1, x:200, y:180}, {id:2, x:340, y:180}, {id:3, x:130, y:300}, {id:4, x:270, y:300}, {id:5, x:410, y:300}];
        edges = [{u:0,v:1},{u:0,v:2},{u:1,v:2},{u:1,v:3},{u:1,v:4},{u:2,v:4},{u:2,v:5},{u:3,v:4},{u:4,v:5},{u:3,v:5, curvature:35}];
      } else if (level === 8) {
        title = "삼중 연결 삼각별";
        nodes = [{id:0, x:270, y:60}, {id:1, x:380, y:270}, {id:2, x:160, y:270}, {id:3, x:270, y:160}, {id:4, x:320, y:240}, {id:5, x:220, y:240}];
        edges = [{u:0,v:1},{u:1,v:2},{u:2,v:0},{u:3,v:4},{u:4,v:5},{u:5,v:3},{u:0,v:3},{u:1,v:4},{u:2,v:5},{u:0,v:4},{u:1,v:5}];
      } else if (level === 9) {
        title = "황금 오각별";
        const R = 110;
        for(let k=0; k<5; k++){
          const ang = -Math.PI/2 + k*2*Math.PI/5;
          nodes.push({id:k, x: Math.round(cx + R*Math.cos(ang)), y: Math.round(cy + R*Math.sin(ang))});
        }
        edges = [{u:0,v:1},{u:1,v:2},{u:2,v:3},{u:3,v:4},{u:4,v:0},{u:0,v:2, isKey: true},{u:2,v:4},{u:4,v:1},{u:1,v:3},{u:3,v:0}];
      } else if (level === 10) {
        title = "다중 브릿지 큐브";
        nodes = [{id:0, x:180, y:100}, {id:1, x:360, y:100}, {id:2, x:360, y:280}, {id:3, x:180, y:280}, {id:4, x:220, y:140}, {id:5, x:320, y:140}, {id:6, x:320, y:240}, {id:7, x:220, y:240}];
        edges = [{u:0,v:1},{u:1,v:2},{u:2,v:3},{u:3,v:0},{u:4,v:5},{u:5,v:6},{u:6,v:7},{u:7,v:4},{u:0,v:4},{u:1,v:5},{u:2,v:6},{u:3,v:7},{u:0,v:2},{u:1,v:3}];
      } else if (level <= 30) {
        const sub = level - 10;
        if (sub === 1) {
          title = "초승달과 활";
          nodes = [{id:0, x:150, y:190}, {id:1, x:390, y:190}, {id:2, x:270, y:80}];
          edges = [{u:0,v:1, curvature:0},{u:0,v:1, curvature:70, isKey:true},{u:0,v:2},{u:1,v:2}];
        } else if (sub === 2) {
          title = "헤엄치는 금붕어";
          nodes = [{id:0, x:130, y:190}, {id:1, x:270, y:100}, {id:2, x:270, y:280}, {id:3, x:390, y:190}, {id:4, x:460, y:110}, {id:5, x:460, y:270}];
          edges = [{u:0,v:1, curvature:-20},{u:0,v:2, curvature:20},{u:1,v:3, curvature:-20},{u:2,v:3, curvature:20},{u:1,v:2},{u:3,v:4},{u:4,v:5},{u:5,v:3},{u:1,v:4}];
        } else if (sub === 3) {
          title = "나비의 날개짓";
          nodes = [{id:0, x:270, y:120}, {id:1, x:270, y:260}, {id:2, x:130, y:110}, {id:3, x:130, y:270}, {id:4, x:410, y:110}, {id:5, x:410, y:270}];
          edges = [{u:0,v:1},{u:0,v:2, curvature:-30},{u:2,v:3},{u:3,v:1, curvature:30},{u:0,v:4, curvature:30},{u:4,v:5},{u:5,v:1, curvature:-30},{u:0,v:3},{u:1,v:2},{u:0,v:5},{u:1,v:4}];
        } else if (sub === 4) {
          title = "눈동자 안경";
          nodes = [{id:0, x:180, y:190}, {id:1, x:270, y:190}, {id:2, x:360, y:190}, {id:3, x:180, y:100}, {id:4, x:360, y:100}];
          edges = [{u:0,v:1},{u:1,v:2},{u:0,v:3, curvature:-40},{u:3,v:1, curvature:-40},{u:0,v:1, curvature:40},{u:1,v:4, curvature:-40},{u:4,v:2, curvature:-40},{u:1,v:2, curvature:40}];
        } else {
          const N = 4 + (sub % 4);
          const R = 110;
          for(let k=0; k<N; k++){
            const ang = -Math.PI/2 + (k*2*Math.PI/N);
            nodes.push({id:k, x: Math.round(cx + R*Math.cos(ang)), y: Math.round(cy + R*Math.sin(ang))});
          }
          title = `곡선 아치 다각형 ${N}호 (Lv.${level})`;
          for(let k=0; k<N; k++){
            const next = (k+1)%N;
            edges.push({u:k, v:next, curvature: (k%2===0 ? 35 : -35)});
            edges.push({u:k, v:next, curvature: 0});
          }
        }
      } else if (level <= 60) {
        const N = 5 + (level % 5);
        const R = 120;
        title = `휠 네트워크 ${N}포크 (Lv.${level})`;
        nodes.push({id:0, x:cx, y:cy});
        for(let k=1; k<=N; k++){
          const ang = -Math.PI/2 + ((k-1)*2*Math.PI/N);
          nodes.push({id:k, x: Math.round(cx + R*Math.cos(ang)), y: Math.round(cy + R*Math.sin(ang))});
        }
        for(let k=1; k<=N; k++){
          const next = (k % N) + 1;
          edges.push({u:k, v:next, curvature: (level%2===0 && k%2===0 ? 25 : 0)});
        }
        for(let k=1; k<=N; k+=2){
          edges.push({u:0, v:k, isKey: (k===1 && level%3===0)});
          const opp = ((k + Math.floor(N/2)) % N) + 1;
          edges.push({u:0, v:opp});
        }
      } else {
        const N = 6 + (level % 4);
        const R_out = 130;
        const R_in = 65;
        title = `이중 회로 네트워크 (Lv.${level})`;
        for(let k=0; k<N; k++){
          const ang = -Math.PI/2 + (k*2*Math.PI/N);
          nodes.push({id:k, x: Math.round(cx + R_out*Math.cos(ang)), y: Math.round(cy + R_out*Math.sin(ang))});
        }
        for(let k=0; k<N; k++){
          const ang = -Math.PI/2 + (k*2*Math.PI/N) + (Math.PI/N);
          nodes.push({id:N+k, x: Math.round(cx + R_in*Math.cos(ang)), y: Math.round(cy + R_in*Math.sin(ang))});
        }
        for(let k=0; k<N; k++){
          edges.push({u:k, v:(k+1)%N, curvature: (k%2===0 ? 20 : -20)});
        }
        for(let k=0; k<N; k++){
          edges.push({u:N+k, v:N+((k+1)%N), curvature: 0});
        }
        for(let k=0; k<N; k++){
          edges.push({u:k, v: N+k, isKey: (k===0 && level%2===0)});
          edges.push({u:(k+1)%N, v: N+k});
        }
      }

      edges = validateAndFixEulerian(nodes, edges);
      return { id: level, title, nodes, edges };
    }

    for (let i = 1; i <= 100; i++) {
      stages.push(buildUniqueStage(i));
    }

    // --- DOM 요소 참조 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const stageSelect = document.getElementById('stage-select');
    const diffBadge = document.getElementById('diff-badge');
    const uiRemaining = document.getElementById('ui-remaining');
    const uiTotal = document.getElementById('ui-total');
    const uiMsg = document.getElementById('ui-msg');
    const btnPrev = document.getElementById('btn-prev');
    const btnReset = document.getElementById('btn-reset');
    const btnDegree = document.getElementById('btn-degree');
    const btnQuizHint = document.getElementById('btn-quiz-hint');
    const btnViewRecords = document.getElementById('btn-view-records');
    const btnSubmitSheet = document.getElementById('btn-submit-sheet');
    const btnNext = document.getElementById('btn-next');
    const displayStudent = document.getElementById('display-student');

    const loginModal = document.getElementById('login-modal');
    const inputStudentId = document.getElementById('input-student-id');
    const inputStudentName = document.getElementById('input-student-name');
    const btnStartGame = document.getElementById('btn-start-game');

    const recordsModal = document.getElementById('records-modal');
    const recordsTableBody = document.getElementById('records-table-body');
    const recordStudentInfo = document.getElementById('record-student-info');
    const recordClearCount = document.getElementById('record-clear-count');
    const btnRecordsClose = document.getElementById('btn-records-close');
    const btnExportCsv = document.getElementById('btn-export-csv');

    const quizModal = document.getElementById('quiz-modal');
    const quizQuestion = document.getElementById('quiz-question');
    const quizAnswer = document.getElementById('quiz-answer');
    const btnQuizSubmit = document.getElementById('btn-quiz-submit');
    const btnQuizCancel = document.getElementById('btn-quiz-cancel');

    stages.forEach((st) => {
      const opt = document.createElement('option');
      opt.value = st.id - 1;
      opt.innerText = `Stage ${st.id}: ${st.title}`;
      stageSelect.appendChild(opt);
    });

    let currentStageIndex = 0;
    let currentNode = null;
    let visitedEdges = [];
    let isDrawing = false;
    let isCleared = false;
    let showDegrees = false;
    let pointerPos = { x: 0, y: 0 };
    let currentQuiz = null;

    function handleLogin() {
      const sid = inputStudentId.value.trim();
      const sname = inputStudentName.value.trim();

      if (!/^\d{4}$/.test(sid)) {
        alert("학번은 4자리 숫자로 입력해주세요! (예: 1105)");
        inputStudentId.focus();
        return;
      }
      if (!sname) {
        alert("이름을 입력해주세요!");
        inputStudentName.focus();
        return;
      }

      currentStudent.id = sid;
      currentStudent.name = sname;
      displayStudent.innerText = `대원: ${sid} ${sname}`;
      loginModal.style.display = 'none';
      initStage(0);
    }

    btnStartGame.addEventListener('click', handleLogin);
    inputStudentId.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') inputStudentName.focus();
    });
    inputStudentName.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin();
    });

    function initStage(idx) {
      currentStageIndex = Math.max(0, Math.min(idx, stages.length - 1));
      stageSelect.value = currentStageIndex;
      
      const diff = getDiffInfo(currentStageIndex + 1);
      diffBadge.innerText = diff.name;
      diffBadge.className = `difficulty-tag ${diff.cls}`;

      resetStroke();
      const stage = stages[currentStageIndex];
      uiTotal.innerText = stage.edges.length;
      btnNext.style.display = 'none';
      startTimer();
      render();
    }

    function resetStroke(failMsg = null) {
      currentNode = null;
      visitedEdges = [];
      isDrawing = false;
      isCleared = false;
      updateUI();

      if (failMsg) {
        uiMsg.innerText = failMsg;
        uiMsg.style.color = "#f87171";
      } else {
        const hasKey = stages[currentStageIndex].edges.some(e => e.isKey);
        uiMsg.innerText = hasKey ? "⭐ 황금 필수 다리를 반드시 지나서 완성하세요!" : "꼭짓점을 꾹 누르고 손을 떼지 않은 채 모든 선을 그리세요!";
        uiMsg.style.color = hasKey ? "#facc15" : "#94a3b8";
      }
      render();
    }

    function updateUI() {
      const stage = stages[currentStageIndex];
      uiRemaining.innerText = stage.edges.length - visitedEdges.length;
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function findNodeAt(x, y) {
      const stage = stages[currentStageIndex];
      return stage.nodes.find(n => Math.hypot(n.x - x, n.y - y) <= 22);
    }

    function getNodeDegree(nodeId) {
      const stage = stages[currentStageIndex];
      return stage.edges.filter(e => e.u === nodeId || e.v === nodeId).length;
    }

    function onStart(e) {
      if (isCleared) return;
      const pos = getPos(e);
      pointerPos = pos;
      const node = findNodeAt(pos.x, pos.y);

      if (node) {
        isDrawing = true;
        currentNode = node;
        visitedEdges = [];
        soundPass();
        uiMsg.innerText = "선을 따라 다음 점으로 드래그하세요!";
        uiMsg.style.color = "#38bdf8";
        updateUI();
        render();
      }
    }

    function onMove(e) {
      if (!isDrawing || isCleared || !currentNode) return;
      pointerPos = getPos(e);

      const targetNode = findNodeAt(pointerPos.x, pointerPos.y);
      if (targetNode && targetNode.id !== currentNode.id) {
        const stage = stages[currentStageIndex];
        
        const edgeIndex = stage.edges.findIndex((edge, idx) => {
          if (visitedEdges.includes(idx)) return false;
          return (edge.u === currentNode.id && edge.v === targetNode.id) ||
                 (edge.v === currentNode.id && edge.u === targetNode.id);
        });

        if (edgeIndex !== -1) {
          const crossedEdge = stage.edges[edgeIndex];
          visitedEdges.push(edgeIndex);
          currentNode = targetNode;
          
          if (crossedEdge.isKey) soundKeyPassed();
          else soundPass();
          
          updateUI();

          if (visitedEdges.length === stage.edges.length) {
            const hasMissedKey = stage.edges.some((e, idx) => e.isKey && !visitedEdges.includes(idx));
            
            if (hasMissedKey) {
              soundFail();
              resetStroke("❌ 필수 황금 다리를 건너지 않았습니다!");
            } else {
              isCleared = true;
              isDrawing = false;
              stopTimer();
              soundWin();

              const curStageId = stage.id;
              const formatted = formatTime(stageElapsedSeconds);

              if (!stageRecords[curStageId] || stageElapsedSeconds < stageRecords[curStageId].timeSeconds) {
                stageRecords[curStageId] = {
                  cleared: true,
                  timeSeconds: stageElapsedSeconds
                };
              }

              uiMsg.innerText = `🎉 Stage ${stage.id} 성공! (기록: ${formatted})`;
              uiMsg.style.color = "#4ade80";
              if (currentStageIndex < stages.length - 1) {
                btnNext.style.display = 'inline-block';
              }
            }
          }
        }
      }
      render();
    }

    function onEnd() {
      if (isCleared) return;
      if (isDrawing) {
        isDrawing = false;
        soundFail();
        resetStroke("❌ 손을 뗐습니다! 한붓그리기는 도중에 손을 떼면 안 됩니다.");
      }
    }

    canvas.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(e); }, { passive: false });
    window.addEventListener('touchmove', (e) => { onMove(e); }, { passive: false });
    window.addEventListener('touchend', onEnd);

    stageSelect.addEventListener('change', (e) => initStage(parseInt(e.target.value)));
    btnPrev.addEventListener('click', () => initStage(currentStageIndex - 1));
    btnNext.addEventListener('click', () => initStage(currentStageIndex + 1));
    btnReset.addEventListener('click', () => resetStroke());
    btnDegree.addEventListener('click', () => {
      showDegrees = !showDegrees;
      btnDegree.classList.toggle('toggle-active', showDegrees);
      render();
    });

    // =========================================================================
    // 🚀 [선생님께 최종 제출 버튼] 클릭 시 1회 통계 전송 로직
    // =========================================================================
    btnSubmitSheet.addEventListener('click', () => {
      const clearedIds = Object.keys(stageRecords)
        .map(Number)
        .filter(id => stageRecords[id].cleared);

      if (clearedIds.length === 0) {
        alert("아직 클리어한 스테이지가 없습니다! 한 단계 이상 성공한 후 제출해주세요.");
        return;
      }

      const maxStage = Math.max(...clearedIds);
      const clearCount = clearedIds.length;
      const totalSeconds = clearedIds.reduce((sum, id) => sum + stageRecords[id].timeSeconds, 0);
      const totalFormatted = formatTime(totalSeconds);

      const confirmMsg = `[최종 결과 제출 확인]\n\n` +
        `• 학번: ${currentStudent.id}\n` +
        `• 이름: ${currentStudent.name}\n` +
        `• 최고 도달 스테이지: Lv.${maxStage}\n` +
        `• 총 클리어 수: ${clearCount}개\n` +
        `• 총 누적 소요시간: ${totalFormatted}\n\n` +
        `선생님께 기록을 제출하시겠습니까?`;

      if (!confirm(confirmMsg)) return;

      btnSubmitSheet.disabled = true;
      btnSubmitSheet.innerText = "제출 중... ⏳";

      const payload = {
        studentId: currentStudent.id,
        studentName: currentStudent.name,
        maxStage: `Lv.${maxStage}`,
        clearCount: `${clearCount} / 100`,
        totalSeconds: totalSeconds,
        totalFormatted: totalFormatted
      };

      fetch(GOOGLE_SHEET_WEBAPP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("🎉 선생님께 성공적으로 제출되었습니다!");
        btnSubmitSheet.innerText = "✅ 제출 완료";
      })
      .catch(err => {
        alert("전송 중 오류가 발생했습니다. 다시 시도해주세요.");
        btnSubmitSheet.disabled = false;
        btnSubmitSheet.innerText = "🚀 선생님께 최종 제출";
      });
    });

    // --- 리포트 조회 모달 ---
    btnViewRecords.addEventListener('click', () => {
      recordStudentInfo.innerText = `학번: ${currentStudent.id} | 성명: ${currentStudent.name}`;
      const clearedCount = Object.values(stageRecords).filter(r => r.cleared).length;
      recordClearCount.innerText = `클리어: ${clearedCount} / ${stages.length}`;

      recordsTableBody.innerHTML = "";
      stages.forEach((st) => {
        const tr = document.createElement('tr');
        const rec = stageRecords[st.id];
        const isClr = rec && rec.cleared;
        const diff = getDiffInfo(st.id);

        tr.innerHTML = `
          <td>Stage ${st.id}</td>
          <td><span class="difficulty-tag ${diff.cls}">${diff.name}</span></td>
          <td style="color: ${isClr ? '#4ade80' : '#64748b'}; font-weight: bold;">
            ${isClr ? 'SUCCESS' : '-'}
          </td>
          <td style="font-family: monospace; color: ${isClr ? '#facc15' : '#64748b'};">
            ${isClr ? formatTime(rec.timeSeconds) : '--:--'}
          </td>
        `;
        recordsTableBody.appendChild(tr);
      });

      recordsModal.style.display = "flex";
    });

    btnRecordsClose.addEventListener('click', () => {
      recordsModal.style.display = "none";
    });

    btnExportCsv.addEventListener('click', () => {
      let csvContent = "\uFEFF";
      csvContent += "학번,이름,스테이지,난이도,성공여부,소요시간(초),소요시간(분초)\n";

      stages.forEach((st) => {
        const rec = stageRecords[st.id];
        const isClr = rec && rec.cleared ? "완료" : "미완료";
        const sec = rec && rec.cleared ? rec.timeSeconds : "";
        const formatted = rec && rec.cleared ? formatTime(rec.timeSeconds) : "";
        const diff = getDiffInfo(st.id).name;

        csvContent += `"${currentStudent.id}","${currentStudent.name}",${st.id},"${diff}","${isClr}",${sec},"${formatted}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `한붓그리기_${currentStudent.id}_${currentStudent.name}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // --- 퀴즈 모달 ---
    btnQuizHint.addEventListener('click', () => {
      currentQuiz = quizPool[Math.floor(Math.random() * quizPool.length)];
      quizQuestion.innerText = currentQuiz.q;
      quizAnswer.value = "";
      quizModal.style.display = "flex";
      quizAnswer.focus();
    });

    btnQuizCancel.addEventListener('click', () => {
      quizModal.style.display = "none";
    });

    btnQuizSubmit.addEventListener('click', () => {
      const userAns = quizAnswer.value.trim();
      if (userAns === currentQuiz.a) {
        quizModal.style.display = "none";
        const stage = stages[currentStageIndex];
        let oddCount = 0;
        const oddNodes = [];
        stage.nodes.forEach(n => {
          if (getNodeDegree(n.id) % 2 !== 0) {
            oddCount++;
            oddNodes.push(n.id);
          }
        });

        let hintStr = `정답입니다! 🎉 힌트가 해금되었습니다.\n\n`;
        if (oddCount === 0) {
          hintStr += `💡 [오일러 회로] 모든 꼭짓점이 짝수점입니다. 어느 점에서 시작해도 제자리로 돌아오며 완성할 수 있습니다.`;
        } else if (oddCount === 2) {
          hintStr += `💡 [오일러 경로] 홀수점이 꼭짓점 [${oddNodes.join(', ')}번] 2개 있습니다. 반드시 이 점들 중 하나에서 시작해야만 성공합니다!`;
        } else {
          hintStr += `💡 홀수점이 ${oddCount}개로 일반적인 한붓그리기가 불가능한 구조입니다.`;
        }
        alert(hintStr);
      } else {
        alert("아쉽네요! 정답이 아닙니다. 다시 시도해보세요. 💡");
      }
    });

    quizAnswer.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btnQuizSubmit.click();
    });

    // --- 캔버스 렌더링 ---
    function drawEdge(u, v, curvature, isVisited, isKey) {
      ctx.beginPath();
      ctx.lineWidth = isVisited ? 6 : (isKey ? 5 : 3.5);
      
      if (isVisited) {
        ctx.strokeStyle = '#38bdf8';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 8;
      } else if (isKey) {
        ctx.strokeStyle = '#facc15';
        ctx.shadowColor = '#eab308';
        ctx.shadowBlur = 10;
      } else {
        ctx.strokeStyle = '#334155';
        ctx.shadowBlur = 0;
      }
      ctx.lineCap = 'round';

      if (!curvature) {
        ctx.moveTo(u.x, u.y);
        ctx.lineTo(v.x, v.y);
      } else {
        const midX = (u.x + v.x) / 2;
        const midY = (u.y + v.y) / 2;
        const dx = v.x - u.x;
        const dy = v.y - u.y;
        const len = Math.hypot(dx, dy);
        const nx = -dy / len;
        const ny = dx / len;

        const ctrlX = midX + nx * curvature;
        const ctrlY = midY + ny * curvature;

        ctx.moveTo(u.x, u.y);
        ctx.quadraticCurveTo(ctrlX, ctrlY, v.x, v.y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const stage = stages[currentStageIndex];

      stage.edges.forEach((edge, idx) => {
        if (!visitedEdges.includes(idx)) {
          drawEdge(stage.nodes[edge.u], stage.nodes[edge.v], edge.curvature, false, edge.isKey);
        }
      });

      visitedEdges.forEach((edgeIdx) => {
        const edge = stage.edges[edgeIdx];
        drawEdge(stage.nodes[edge.u], stage.nodes[edge.v], edge.curvature, true, false);
      });

      if (isDrawing && currentNode) {
        ctx.beginPath();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#facc15';
        ctx.setLineDash([5, 5]);
        ctx.moveTo(currentNode.x, currentNode.y);
        ctx.lineTo(pointerPos.x, pointerPos.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      stage.nodes.forEach((node) => {
        const isCurrent = currentNode && currentNode.id === node.id;
        const deg = getNodeDegree(node.id);
        const isOdd = deg % 2 !== 0;

        ctx.beginPath();
        ctx.arc(node.x, node.y, 14, 0, Math.PI * 2);
        ctx.fillStyle = isCurrent ? '#f43f5e' : (showDegrees && isOdd ? '#e11d48' : '#1e293b');
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = isCurrent ? '#ffffff' : (showDegrees && isOdd ? '#fda4af' : '#64748b');
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(showDegrees ? `${deg}` : `${node.id}`, node.x, node.y);
      });
    }
  </script>
